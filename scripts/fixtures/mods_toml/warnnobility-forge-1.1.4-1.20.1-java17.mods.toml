modLoader = "javafml"
loaderVersion = "[47,)"
license = "All Rights Reserved"

[[mods]]
modId = "warnnobility"
version = "1.1.4"
displayName = "War 'n Nobility"
authors = "NewtL"
description = '''
A configurable noble-rank and vassalage progression system. Hooks into MineColonies War 'n Taxes for war outcomes.
'''

[[dependencies.warnnobility]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.warnnobility]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

# REQUIRED: the colony system this mod reads for territory and the War 'n Taxes wars that drive seals.
[[dependencies.warnnobility]]
modId = "minecolonies"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# REQUIRED: Machiavelli's War 'n Taxes (its @Mod id is "minecolonytax", NOT "warntaxes"). It runs the wars
# whose outcomes WarTaxesBridge turns into seals.
[[dependencies.warnnobility]]
modId = "minecolonytax"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# OPTIONAL: Easy Factions backs the King gate (lead a faction over the claim threshold) and the faction
# map overlay. Every reference is isolated behind FactionGate.loaded() so the King gate simply stays
# dormant when EF is absent; the rest of the nobility ladder runs standalone.
[[dependencies.warnnobility]]
modId = "easy_factions"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# OPTIONAL (CLIENT side only): the nobility-domain MAP overlay renders on Antique Atlas. AA is reached
# purely by reflection (no compile dep) and every draw is fail-soft, so when it is absent the map falls
# back to a plain parchment backdrop and everything else still works.
[[dependencies.warnnobility]]
modId = "antique_atlas"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
