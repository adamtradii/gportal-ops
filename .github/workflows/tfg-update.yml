# Keep the G-Portal server on the right PACK: "TFG Crownfall" (TerraFirmaGreg Modern + the Crownfall mods, default) or plain TFG.
#
# THE PACK (2026-10-30, owner: "add the crownfall mods and TFG into a new pack and configure the autoupdater using that pack")
#   pack=crownfall (default)  TFG's serverpack + every mod of pack/crownfall/additions.json with side both|server (downloaded, size+sha1
#                             checked, REFUSED on mismatch) + pack/crownfall/overrides/. Pack version / marker = "<tfg tag>+cf<additions_version>"
#                             (e.g. 0.13.17+cf1): a change of EITHER part installs. Built by scripts/build_pack.py.
#   pack=tfg                  plain TFG, marker = the TFG tag (the fall-back; switching packs changes the marker, so it reinstalls).
#   refresh_mods (default true, manual runs of the crownfall pack only)  scripts/refresh_additions.py first looks for newer Forge 1.20.1
#                             files of the Modrinth-sourced mods and bumps additions_version. A CHANGED lock is not installed (the run stops
#                             after the build and uploads the refreshed lock as an artifact) unless skip_lab=true, because a refreshed mod
#                             must pass the boot test first. After a successful install the refreshed lock is committed back with [skip ci].
#
# FROZEN BY DEFAULT (2026-10-27). The daily schedule does nothing unless .github/TFG_AUTO_UPDATE says "on".
# Why: tfgworkers' crew mod (AI worker bodies) is pinned to a pack version, and tfgworkers/CLAUDE.md says to freeze
# this updater while it is. Two unattended runs (2026-10-26 -> 0.13.16, 2026-10-27 -> 0.13.17) wiped mods/ + config/,
# failed half way through the upload, and left a half-installed pack with the crew mod gone. A person starts
# every update now: Actions -> "TFG auto-update" -> Run workflow (workflow_dispatch always works).
#
# Manual inputs:
#   dry_run=true      read-only rehearsal: reads the server, downloads and stages the pack, prints every generated
#                     script and what would be deleted/uploaded. No delete, no put, no rm on the server.
#   version_match     pin the TFG release. A plain version ("0.13.17") means exactly that tag; anything else is a regex
#                     over the tag name. Empty = newest. TFG tags have NO leading v (0.13.17).
#   force=true        reinstall even if the .tfg-version marker already equals the chosen pack version (needed to
#                     re-lay a version the marker already names, e.g. repairing a failed install).
#   pack              crownfall (default) | tfg. See above.
#   refresh_mods      "true" (default) | "false": look for newer mod files before building (manual runs only).
#   skip_lab          "true" installs even though refresh_mods changed the lock (only after a lab boot test of that lock).
#   wipe_world=true   ALSO delete the world. Only when a TFG release note requires it.
#
# What a run does (all FTP work lives in scripts/tfg_ftp.py, tested by scripts/test_tfg_ftp.py):
#   save crew mod + config -> wipe pack folders (verified, retried) -> upload (rm by exact name + PLAIN put, never
#   'put -c'; failures read from lftp's own messages, retried per file, read-back verified) -> re-apply server fixes
#   -> put the saved files back -> write the version marker (only when the upload and fixes succeeded).
#   The fixes and the put-back run after ANY upload outcome; the job is still marked failed if the upload was.
#
# G-Portal FTP quirks (observed): no NLST, no SITE CHMOD, drops long sessions. lftp's exit status is that of the
# LAST command only, so it can never be used to say a chunk worked.
#
# The update runs over FTP while the server may be online; ask the owner to STOP the server first (a restart in the
# middle boots a mixed pack). Expect ~25-45 min (wipe 4-11 min, upload 5-25 min).
name: TFG auto-update
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: redeploy even if the version marker matches ("true")
        required: false
        default: "false"
      wipe_world:
        description: ALSO delete the world - only when a TFG update requires it ("true")
        required: false
        default: "false"
      version_match:
        description: pin a release, e.g. 0.13.17 (exact tag) or a regex; empty = newest
        required: false
        default: ""
      dry_run:
        description: rehearse only - read the server, print the plan, change nothing ("true")
        required: false
        default: "false"
      pack:
        description: "which pack to install: crownfall (TFG + Crownfall mods) or tfg (plain TFG fall-back)"
        required: false
        type: choice
        options: [crownfall, tfg]
        default: crownfall
      refresh_mods:
        description: 'look for newer mod files first (crownfall only; a changed lock stops the run after the build unless skip_lab) ("true"/"false")'
        required: false
        default: "true"
      skip_lab:
        description: 'install a refreshed lock without the lab boot test ("true")'
        required: false
        default: "false"

concurrency:
  group: tfg-update
  cancel-in-progress: false   # two runs wiping the same server at once would be worse than waiting

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write      # only the "Commit the refreshed lock" step writes
    env:
      PACK: ${{ inputs.pack || 'crownfall' }}
      # Files that are not the pack's but live inside the folders the update wipes: tfgworkers' deploy-gportal puts the
      # crew mod + its config there. Saved before the wipe, put back after the upload, read back and compared.
      # Exact paths only (G-Portal FTP cannot list). A server-side .keep-files (one path per line) adds to this list.
      # A path that is not on the server is only a warning (nothing to keep), never a failure.
      KEEP_FILES: "mods/tfgcrew-1.20.1-0.2.0.jar config/tfgcrew-common.toml"
      DRY_RUN: ${{ inputs.dry_run }}
      WIPE_WORLD: ${{ inputs.wipe_world }}
    steps:
      - uses: actions/checkout@v4

      - name: Freeze gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mode=$(grep -vE '^[[:space:]]*(#|$)' .github/TFG_AUTO_UPDATE 2>/dev/null | head -n1 | tr -d '[:space:]' | tr 'A-Z' 'a-z' || true)
          echo "event=$EVENT TFG_AUTO_UPDATE='${mode:-missing}'"
          if [ "$EVENT" = "schedule" ] && [ "$mode" != "on" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "## TFG auto-update is FROZEN" >> "$GITHUB_STEP_SUMMARY"
            echo "The daily run skipped. Start an update by hand (Run workflow), or put 'on' in .github/TFG_AUTO_UPDATE to unfreeze the schedule." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh mods (newest Forge 1.20.1 files; the lock only changes on this runner until the install succeeds)
        id: refresh
        if: steps.gate.outputs.run == 'yes' && env.PACK == 'crownfall' && github.event_name == 'workflow_dispatch' && inputs.refresh_mods != 'false'
        run: python3 scripts/refresh_additions.py

      - name: Check current vs latest
        id: check
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
          VMATCH: ${{ inputs.version_match }}
          FORCE: ${{ inputs.force }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          python3 scripts/tfg_ftp.py release          # TFG tag + asset urls
          python3 scripts/build_pack.py version       # latest.txt := the PACK VERSION (tag, or tag+cf<n>) the marker will hold
          python3 scripts/tfg_ftp.py current
          CURRENT=$(cat current.txt)
          LATEST=$(cat latest.txt)
          echo "current=$CURRENT latest=$LATEST force=${FORCE:-false} dry_run=${DRY_RUN:-false}"
          if [ "$CURRENT" = "$LATEST" ] && [ "${FORCE:-false}" != "true" ] && [ "${DRY_RUN:-false}" != "true" ]; then
            echo "update=no" >> "$GITHUB_OUTPUT"
            echo "## Pack up to date: $CURRENT (pack=$PACK)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "update=yes" >> "$GITHUB_OUTPUT"
            echo "LATEST=$LATEST" >> "$GITHUB_ENV"
            echo "ASSET_URL=$(cat asset_url.txt)" >> "$GITHUB_ENV"
            echo "RELEASE_URL=$(cat release_url.txt)" >> "$GITHUB_ENV"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "## DRY RUN: would move the server from $CURRENT to $LATEST, pack=$PACK (nothing was changed)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # Everything that can be wrong with the pack (a bad hash, a missing url, two jars of one mod, a missing dependency)
      # fails HERE, before the first destructive FTP step. Also writes wipe-extra.txt (folders the overrides bring).
      - name: Build server payload
        if: steps.check.outputs.update == 'yes'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_pack.py server

      # A refreshed lock has not been boot-tested: stop after the build (nothing on the server was touched) unless the
      # person says skip_lab=true. A dry run is read-only anyway, so it goes through.
      - name: Lab gate
        id: labgate
        if: steps.check.outputs.update == 'yes'
        env:
          CHANGED: ${{ steps.refresh.outputs.changed }}
          SKIP_LAB: ${{ inputs.skip_lab }}
        run: |
          if [ "$CHANGED" = "true" ] && [ "$SKIP_LAB" != "true" ] && [ "${DRY_RUN:-false}" != "true" ]; then
            echo "proceed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::The mod lock changed (refresh_mods). Built and verified, NOT installed: it needs a lab boot test first."
            {
              echo "## NOT INSTALLED: the mod lock changed"
              echo "The refreshed mods were downloaded, hash-checked and staged, but nothing on the server was touched."
              echo '```'; cat refresh-report.md; echo '```'
              echo "Next: boot-test this lock in the lab (artifact 'additions-refreshed' has the file), commit it to pack/crownfall/additions.json,"
              echo "then run this workflow again with refresh_mods=false, or run it with skip_lab=true to install the refreshed lock as it is."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the refreshed lock for the lab test
        if: steps.labgate.outputs.proceed == 'no'
        uses: actions/upload-artifact@v4
        with:
          name: additions-refreshed
          path: |
            pack/crownfall/additions.json
            refresh-report.md

      - name: Save files that are not the pack's (crew mod, its config)
        id: save
        if: steps.labgate.outputs.proceed == 'yes'
        env:
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
        run: python3 scripts/tfg_ftp.py save

      - name: Remove old pack folders (world untouched)
        id: wipe
        if: steps.labgate.outputs.proceed == 'yes'
        env:
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
        run: python3 scripts/tfg_ftp.py wipe

      - name: Upload (listing-free, chunked, verified)
        id: upload
        if: steps.labgate.outputs.proceed == 'yes'
        env:
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
        run: python3 scripts/tfg_ftp.py upload

      # From here on the steps run after ANY upload outcome (but only if the wipe step started, i.e. the server may
      # have been touched): the fixes and the crew-mod put-back must never be skipped by a failed upload.
      - name: Re-apply server fixes
        id: fixes
        if: always() && steps.labgate.outputs.proceed == 'yes' && steps.wipe.outcome != 'skipped'
        env:
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
        run: python3 scripts/tfg_ftp.py fixes

      - name: Put back the saved files
        id: restore
        if: always() && steps.labgate.outputs.proceed == 'yes' && steps.wipe.outcome != 'skipped'
        env:
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
        run: python3 scripts/tfg_ftp.py restore

      # The marker says "this version is installed". Only an install whose upload and fixes succeeded may claim it;
      # otherwise the next run sees the old marker and retries.
      - name: Write version marker (verified)
        id: marker
        if: always() && steps.labgate.outputs.proceed == 'yes' && steps.upload.outcome == 'success' && steps.fixes.outcome == 'success'
        env:
          HOST: ${{ secrets.GPORTAL_FTP_SERVER }}
          PORT: ${{ secrets.GPORTAL_FTP_PORT }}
          FUSER: ${{ secrets.GPORTAL_FTP_USERNAME }}
          FPASS: ${{ secrets.GPORTAL_FTP_PASSWORD }}
        run: python3 scripts/tfg_ftp.py marker

      # The lock only becomes the repo's lock once the pack it describes is installed. [skip ci]: no other workflow reacts.
      - name: Commit the refreshed lock
        if: steps.marker.outcome == 'success' && steps.refresh.outputs.changed == 'true' && inputs.dry_run != 'true'
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::run is on '$GITHUB_REF_NAME', not main: the refreshed lock is NOT committed (artifact-free); re-run on main"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack/crownfall/additions.json
          git diff --cached --quiet && { echo "lock unchanged in git"; exit 0; }
          git commit -q -m "Refresh Crownfall mod lock to $LATEST [skip ci]" -m "$(cat refresh-report.md)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && { echo "lock committed"; exit 0; }
            sleep 5
          done
          echo "::error::the server is updated but the refreshed lock could not be pushed; run: git add pack/crownfall/additions.json from the 'additions-refreshed' content or re-run refresh_additions.py"
          exit 1
